services:
  quicknotes:
    image: quicknotes:lab6
    build:
      context: ./app
      dockerfile: Dockerfile

    ports:
      - "8080:8080"
    volumes:
      - quicknotes-data:/data

    # mounts a temporary file system inside the container. Permission can be controlled as required (ReadOnly)
    # tmpfs:
    #   - /data:mode=755,uid=1009,gid=1009

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:8080/quicknotes/health | python3 -m json.tool > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      ADDR: ":8080"
      DATA_PATH: "/data/notes.json"
      SEED_PATH: "seed.json"
    restart: unless-stopped

volumes:
  quicknotes-data:
