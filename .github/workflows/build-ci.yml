name: Build CI

# Triggers
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

# Permissions
permissions:
  contents: read

# Working Directory
defaults:
  run:
    working-directory: app

jobs:
  vet:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version: "1.24"
          cache: false
      - name: Vet Application
        run: go vet ./...

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version: "1.24"
          cache: false
      - name: Test Application
        run: go test -race -count=1 ./...
