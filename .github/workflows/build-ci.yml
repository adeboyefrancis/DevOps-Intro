name: Build CI

# Triggers
on:
  push:
    branches: [main]
    paths: # Ensures only the following paths trigger a build, Whle skipping Ad-hoc changes e.g. Docs
      - "app/**"
      - ".github/workflows/build-ci.yml"

  pull_request:
    branches: [main]
    # paths:
    #   - 'app/**'
    #   - '.github/workflows/build-ci.yml'

# Permissions
permissions:
  contents: read

jobs:
  vet:
    name: Vet (Go ${{ matrix.go }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24"] # Use test suite later if required ["1.25", "1.26"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: app/...

      - name: Vet Code
        working-directory: app
        run: go vet ./...

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: app/...

      - name: Run Tests
        working-directory: app
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25" # Use test suite later if required ["1.25", "1.26"]
          cache: true
          cache-dependency-path: app/...

      - name: Lint using golangci-lint
        uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128 # v8.0.0
        with:
          version: v2.5.0
          working-directory: app

  ci-ok:
    if: always()
    needs: [vet, test, lint]
    runs-on: ubuntu-26.04
    steps:
      - run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
